server {
    listen 8085;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://bionicpro-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reports {
        auth_request /_auth;
        auth_request_set $auth_token $upstream_http_x_access_token;
        auth_request_set $rotated_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $rotated_cookie always;

        proxy_set_header Authorization "Bearer $auth_token";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        set $reports_upstream http://bionicpro-api:8000;
        proxy_pass $reports_upstream;
    }

    location = /_auth {
        internal;
        proxy_pass http://bionicpro-auth:8000/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
}
