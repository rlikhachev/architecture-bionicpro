x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "BionicPRO"
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif:ro
    command: --copy-service
    ports:
      - "389:389"
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      AUTH_CLIENT_ID: bionicpro-auth
      AUTH_CLIENT_SECRET: bionicpro-auth-9f2c4e7a1b8d3f60
      AUTH_REDIRECT_URI: http://localhost:8085/auth/callback
      FRONTEND_URL: http://localhost:8085
      REPORTS_API_URL: http://bionicpro-api:8000
      SESSION_TTL_SECONDS: "28800"
      COOKIE_SECURE: "true"
      AUTH_SECRET_KEY: bionicpro-session-secret-key-4d7f
    ports:
      - "8000:8000"
    depends_on:
      - keycloak
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth
  nginx-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8085:8085"
    depends_on:
      - bionicpro-auth
      - frontend
  crm_db:
    image: postgres:14
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - ./crm/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
  airflow-db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname BionicPRO --role Admin --email admin@bionicpro.local || true"
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    command: airflow webserver --port 8080
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    command: airflow scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  bionicpro-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      TOKEN_AUDIENCE: reports-api
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      DEFAULT_REPORT_DAYS: "7"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: bionicpro
      S3_SECRET_KEY: bionicpro-secret
      S3_BUCKET: reports
      CDN_BASE_URL: http://localhost:8081
    ports:
      - "8002:8000"
    depends_on:
      keycloak:
        condition: service_started
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
  minio:
    image: minio/minio
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bionicpro
      MINIO_ROOT_PASSWORD: bionicpro-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
  minio-init:
    image: minio/mc
    entrypoint: /bin/sh -c "mc alias set local http://minio:9000 bionicpro bionicpro-secret; mc mb --ignore-existing local/reports; mc anonymous set download local/reports; exit 0"
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:8081"
    depends_on:
      minio-init:
        condition: service_completed_successfully
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
  kafka-connect:
    image: debezium/connect:2.5.2.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: bionicpro_connect_configs
      OFFSET_STORAGE_TOPIC: bionicpro_connect_offsets
      STATUS_STORAGE_TOPIC: bionicpro_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: localhost
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      crm_db:
        condition: service_healthy
  debezium-init:
    image: curlimages/curl:8.7.1
    volumes:
      - ./debezium/crm-connector.json:/connector.json:ro
    entrypoint: >-
      /bin/sh -c "for i in $(seq 1 60); do curl -sf http://kafka-connect:8083/connectors >/dev/null 2>&1 && break; sleep 5; done; curl -sf -X POST -H 'Content-Type: application/json' -d @/connector.json http://kafka-connect:8083/connectors || curl -sf http://kafka-connect:8083/connectors/crm-connector >/dev/null; exit 0"
    restart: "no"
    depends_on:
      - kafka-connect

volumes:
  minio-data:
